<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Health Dashboard – Opulent Hardware</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Google Charts loader -->
  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    :root {
      --bg-main: #05050a;
      --bg-card: #101321;
      --bg-card-soft: #15182a;
      --accent: #45f5b6;
      --accent-soft: rgba(69, 245, 182, 0.15);
      --text-main: #f5f7ff;
      --text-soft: #a5abc8;
      --border-subtle: #23263a;
      --radius-xl: 20px;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    body {
      font-family: "Saira", sans-serif;
      background: #05050a;
      color: var(--text-main);
      display: block;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* Main container – responsive */
    .oh-shell {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: linear-gradient(145deg, #0a0b14, #090a12 45%, #05050a 100%);
      border-radius: 0; /* mobile-friendly fullscreen */
      border: 1px solid rgba(255,255,255,0.03);
      padding: 16px;
      box-sizing: border-box;
    }

    header.oh-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .oh-title {
      font-size: 1.2rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .oh-subtitle {
      font-size: 0.75rem;
      color: var(--text-soft);
    }

    .date-strip {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
      width: 100%;
    }

    .date-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: #0c0f1c;
      color: var(--text-soft);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .date-pills {
      flex: 1;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px;
      background: #0a0d18;
      border-radius: 999px;
      scrollbar-width: none;
    }
    .date-pills::-webkit-scrollbar { display: none; }

    .date-pill {
      background: transparent;
      color: var(--text-soft);
      border: 1px solid transparent;
      padding: 5px 12px;
      border-radius: 999px;
      white-space: nowrap;
      font-size: 0.75rem;
    }

    .date-pill.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    /* Layout */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 800px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
      color: var(--text-soft);
    }

    .macro-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .macro-chip {
      background: var(--bg-card-soft);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .macro-value {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .health-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .health-pill {
      font-size: 0.7rem;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
    }

    /* TABLE */
    .food-table-wrapper {
      max-height: 260px;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    th {
      background: #0f1322;
      padding: 8px;
      text-align: left;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    td {
      padding: 6px 8px;
      color: var(--text-soft);
    }

    tr:nth-child(even) {
      background: rgba(255,255,255,0.03);
    }

    .food-name {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Footer */
    .oh-footer {
      margin-top: 18px;
      font-size: 0.65rem;
      color: var(--text-soft);
      opacity: 0.8;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="oh-shell">
  <header class="oh-header">
    <div>
      <div class="oh-title">Daily Health Dashboard</div>
      <div class="oh-subtitle">Live from your Google Sheet</div>
    </div>
  </header>

  <!-- DATE BAR -->
  <div class="date-strip">
    <button id="prevDayBtn" class="date-nav-btn">&#x2039;</button>
    <div id="datePills" class="date-pills"></div>
    <button id="nextDayBtn" class="date-nav-btn">&#x203A;</button>
  </div>

  <div class="main-layout">
    <!-- SUMMARY -->
    <section class="card">
      <div class="card-title">Daily Summary</div>

      <div class="macro-row">
        <div class="macro-chip">
          <div class="macro-value" id="caloriesTotal">0</div>
          <div class="macro-sub">Calories</div>
        </div>
        <div class="macro-chip">
          <div class="macro-value" id="proteinTotal">0 g</div>
          <div class="macro-sub">Protein</div>
        </div>
        <div class="macro-chip">
          <div class="macro-value" id="fiberTotal">0 g</div>
          <div class="macro-sub">Fiber</div>
        </div>
      </div>

      <div id="healthTags" class="health-tags"></div>
    </section>

    <!-- TABLE -->
    <section class="card">
      <div class="card-title">Food Log</div>

      <div class="food-table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Food</th>
              <th>Cal</th>
              <th>P</th>
              <th>F</th>
              <th>Flags</th>
            </tr>
          </thead>
          <tbody id="foodTableBody"></tbody>
        </table>
      </div>

      <div id="noDataMsg" style="display:none; margin-top:8px; color:var(--text-soft); font-size:0.8rem;">
        No entries for this date.
      </div>
    </section>
  </div>

  <div class="oh-footer">by Opulent Hardware</div>

</div>

<script>
/* ---------- GOOGLE SHEET CONFIG ---------- */
const SPREADSHEET_ID = "1-lWs7VyJhhhF_c60LwszUx2SQoqLdK4zhBioJRPa7m0";
const SHEET_NAME = "Tab";

google.charts.load("current", { packages: ["table"] });
google.charts.setOnLoadCallback(initDashboard);

let rowsByDate = {};
let sortedDates = [];
let currentIndex = 0;

function initDashboard() {
  const baseUrl =
    `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${SHEET_NAME}&headers=1`;

  const query = new google.visualization.Query(
    baseUrl + "&tq=" + encodeURIComponent("select A,B,C,D,E,F,G,H,I,J")
  );

  query.send(handleData);
}

function handleData(response) {
  if (response.isError()) {
    console.error(response.getMessage());
    return;
  }

  const dt = response.getDataTable();

  for (let r = 0; r < dt.getNumberOfRows(); r++) {
    const dateVal = dt.getValue(r, 0);
    if (!dateVal) continue;

    const d = new Date(dateVal);
    const key = d.toISOString().slice(0, 10);

    rowsByDate[key] ??= [];
    rowsByDate[key].push({
      food: dt.getValue(r, 1),
      calories: +dt.getValue(r, 2) || 0,
      protein: +dt.getValue(r, 3) || 0,
      fiber: +dt.getValue(r, 4) || 0,
      hf: (dt.getValue(r, 5) || "").toString(),
      ls: (dt.getValue(r, 6) || "").toString(),
      cf: (dt.getValue(r, 7) || "").toString(),
      hh: (dt.getValue(r, 8) || "").toString(),
      notes: dt.getValue(r, 9),
    });
  }

  sortedDates = Object.keys(rowsByDate).sort().reverse();
  buildDatePills();
  updateView();
}

function buildDatePills() {
  const pills = document.getElementById("datePills");
  pills.innerHTML = "";

  sortedDates.forEach((d, i) => {
    const el = document.createElement("button");
    el.className = "date-pill";
    el.textContent = new Date(d).toLocaleDateString();
    el.onclick = () => {
      currentIndex = i;
      updateView();
    };
    pills.appendChild(el);
  });
}

document.getElementById("prevDayBtn").onclick = () => {
  currentIndex = Math.min(currentIndex + 1, sortedDates.length - 1);
  updateView();
};
document.getElementById("nextDayBtn").onclick = () => {
  currentIndex = Math.max(currentIndex - 1, 0);
  updateView();
};

function updateView() {
  const pills = document.querySelectorAll(".date-pill");
  pills.forEach(p => p.classList.remove("active"));
  if (pills[currentIndex]) pills[currentIndex].classList.add("active");

  const d = sortedDates[currentIndex];
  const rows = rowsByDate[d] || [];

  /* totals */
  let cal = 0, prot = 0, fib = 0;
  let flags = [];

  rows.forEach(r => {
    cal += r.calories;
    prot += r.protein;
    fib += r.fiber;
    if (isYes(r.hh)) flags.push("Heart");
    if (isYes(r.cf)) flags.push("Chol");
    if (isYes(r.hf)) flags.push("Fats");
    if (isYes(r.ls)) flags.push("LowSugar");
  });

  document.getElementById("caloriesTotal").textContent = cal;
  document.getElementById("proteinTotal").textContent = prot + " g";
  document.getElementById("fiberTotal").textContent = fib + " g";

  /* health tags */
  const ht = document.getElementById("healthTags");
  ht.innerHTML = "";
  if (rows.length > 0) {
    flags.forEach(f => {
      const tag = document.createElement("div");
      tag.className = "health-pill";
      tag.textContent = f;
      ht.appendChild(tag);
    });
  }

  /* table */
  const tbody = document.getElementById("foodTableBody");
  tbody.innerHTML = "";

  if (rows.length === 0) {
    document.getElementById("noDataMsg").style.display = "block";
    return;
  } else {
    document.getElementById("noDataMsg").style.display = "none";
  }

  rows.forEach(r => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><span class="food-name">${r.food}</span></td>
      <td>${r.calories}</td>
      <td>${r.protein}</td>
      <td>${r.fiber}</td>
      <td>${buildFlag(r)}</td>
    `;
    tbody.appendChild(tr);
  });
}

function buildFlag(r) {
  const arr = [];
  if (isYes(r.hh)) arr.push("❤️");
  if (isYes(r.cf)) arr.push("🫀");
  if (isYes(r.hf)) arr.push("🥑");
  if (isYes(r.ls)) arr.push("🟦");
  return arr.join(" ");
}

function isYes(v) {
  return ["yes","y","true","1"].includes((v || "").toLowerCase());
}
</script>

</body>
</html>
